services:
  - type: web
    name: suraksha-backend
    runtime: docker          # Use the Dockerfile in this folder
    plan: free
    dockerfilePath: ./Dockerfile   # Path relative to the repo root (or the root dir set in Render)

    healthCheckPath: /         # Use GET / since there's no /health route yet

    envVars:
      # ── Database ─────────────────────────────────────────────────────────────
      # Set these in the Render dashboard WITH the PROD_ prefix (e.g. PROD_MONGO_URI)
      - key: PROD_MONGO_URI
        sync: false

      - key: PROD_DB_NAME
        sync: false

      # ── Email Config ──────────────────────────────────────────────────────────
      - key: PROD_EMAIL_SENDER
        sync: false

      - key: PROD_EMAIL_PASSWORD
        sync: false

      # ── Twilio ────────────────────────────────────────────────────────────────
      - key: PROD_TWILIO_ACCOUNT_SID
        sync: false

      - key: PROD_TWILIO_AUTH_TOKEN
        sync: false

      - key: PROD_TWILIO_PHONE_NUMBER
        sync: false

      # ── JWT Auth ──────────────────────────────────────────────────────────────
      - key: PROD_JWT_SECRET_KEY
        generateValue: true   # Render auto-generates a secure random secret

      - key: PROD_JWT_ALGORITHM
        value: HS256

      - key: PROD_ACCESS_TOKEN_EXPIRE_MINUTES
        value: "60"

      # ── Runtime ───────────────────────────────────────────────────────────────
      - key: ENV_STATE
        value: prod           # Activates ProdConfig (reads PROD_ prefixed vars)