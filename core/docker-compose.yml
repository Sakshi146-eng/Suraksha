version: "3.9"

services:
  backend:
    build:
      context: .
      dockerfile: Dockerfile
    container_name: suraksha-backend
    ports:
      - "8000:8000"
    env_file:
      - .env                  # Local development: put your secrets in core/.env
    environment:
      # Override / supplement .env values here if needed
      ENV_STATE: prod         # tells config.py to use ProdConfig (PROD_ prefix)
    volumes:
      - ./uploads:/app/uploads  # Persist uploaded files outside the container
    restart: unless-stopped
